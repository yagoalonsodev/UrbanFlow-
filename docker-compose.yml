services:
  # INGESTION
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urbanflow-ingestion
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # POSTGRESQL - DATA WAREHOUSE
  postgres:
    image: postgres:16
    container_name: urbanflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MINIO - DATA LAKE
  minio:
    image: minio/minio:latest
    container_name: urbanflow-minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # KAFKA
  kafka:
    image: apache/kafka:latest
    container_name: urbanflow-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        HOST://0.0.0.0:9092,
        DOCKER://0.0.0.0:9093,
        CONTROLLER://0.0.0.0:9094

      KAFKA_ADVERTISED_LISTENERS: >-
        HOST://localhost:9092,
        DOCKER://kafka:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        HOST:PLAINTEXT,
        DOCKER:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  # KAFKA TOPICS INIT
  kafka-init:
    image: apache/kafka:latest
    container_name: urbanflow-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        echo "Creando topics de UrbanFlow..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9093 \
          --create \
          --if-not-exists \
          --topic gtfs-realtime \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9093 \
          --create \
          --if-not-exists \
          --topic transport-alerts \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9093 \
          --create \
          --if-not-exists \
          --topic transport-errors \
          --partitions 3 \
          --replication-factor 1

        echo ""
        echo "Topics creados:"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9093 \
          --list

  # GTFS-RT PRODUCER
  producer:
    build:
      context: .
      dockerfile: streaming/Dockerfile.producer

    container_name: urbanflow-producer
    restart: unless-stopped

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093

    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # SPARK STRUCTURED STREAMING
  spark-streaming:
    build:
      context: .
      dockerfile: streaming/Dockerfile.spark

    container_name: urbanflow-spark-streaming
    restart: unless-stopped

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      POSTGRES_HOST: postgres

    depends_on:
      kafka-init:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

    volumes:
      - spark_checkpoint:/tmp/urbanflow-checkpoint-postgres

  # AIRFLOW DATABASE
  airflow-postgres:
    image: postgres:16
    container_name: urbanflow-airflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # AIRFLOW INITIALIZATION
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: urbanflow-airflow-init

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__AUTH_MANAGER:
        airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/app/data
      - ./logs:/app/logs

    command:
      - bash
      - -c
      - |
        airflow db migrate

  # AIRFLOW API SERVER
  airflow-apiserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: urbanflow-airflow-apiserver
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__AUTH_MANAGER:
        airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/app/data
      - ./logs:/app/logs

    ports:
      - "8081:8080"

    command:
      - api-server
      - --host
      - 0.0.0.0
      - --port
      - "8080"

  # AIRFLOW SCHEDULER
  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: urbanflow-airflow-scheduler
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__AUTH_MANAGER:
        airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/app/data
      - ./logs:/app/logs

    command:
      - scheduler

  # AIRFLOW DAG PROCESSOR
  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: urbanflow-airflow-dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__AUTH_MANAGER:
        airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/app/data
      - ./logs:/app/logs

    command:
      - dag-processor

  # AIRFLOW TRIGGERER
  airflow-triggerer:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: urbanflow-airflow-triggerer

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__AUTH_MANAGER:
        airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/app/data
      - ./logs:/app/logs

    command:
      - triggerer

  # METABASE DATABASE
  metabase-postgres:
    image: postgres:16
    container_name: urbanflow-metabase-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase

    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U metabase -d metabase"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # METABASE
  metabase:
    image: metabase/metabase:latest
    container_name: urbanflow-metabase
    restart: unless-stopped

    depends_on:
      metabase-postgres:
        condition: service_healthy

      postgres:
        condition: service_healthy

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: metabase-postgres

    ports:
      - "3000:3000"

  # LANGGRAPH AGENT
  urbanflow-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile

    container_name: urbanflow-agent
    profiles:
      - agent

    restart: unless-stopped

    environment:
      AGENT_DATABASE_URL: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      OLLAMA_BASE_URL: http://host.docker.internal:11434

      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}

      LANGGRAPH_PORT: 2024

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "2024:2024"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:2024/ok')"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

    command:
      - langgraph
      - dev
      - --host
      - 0.0.0.0
      - --port
      - "2024"


# VOLUMES
volumes:
  postgres_data:
  minio_data:
  airflow_postgres_data:
  metabase_postgres_data:
  spark_checkpoint:
  ollama_data: