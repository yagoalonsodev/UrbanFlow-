name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      TMB_APP_ID: ci-app-id
      TMB_APP_KEY: ci-app-key
      POSTGRES_DB: urbanflow
      POSTGRES_USER: urbanflow
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      MINIO_ROOT_USER: ci-minio-user
      MINIO_ROOT_PASSWORD: ci-minio-password
      MINIO_ENDPOINT: localhost:9000
      MINIO_BUCKET: urbanflow
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      URBANFLOW_BASE_DIR: ${{ github.workspace }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check

      - name: Comprobar sintaxis Python
        run: |
          python -m compileall -q dags ingestion processing streaming tests utils

      - name: Ejecutar Ruff
        run: |
          python -m ruff check dags ingestion processing streaming tests utils

      - name: Ejecutar Mypy
        run: |
          python -m mypy dags ingestion processing streaming utils

      - name: Validar Docker Compose
        run: |
          docker compose config --quiet

      - name: Construir imágenes del proyecto
        run: |
          docker compose build \
            ingestion \
            producer \
            spark-streaming \
            airflow-init \
            airflow-apiserver \
            airflow-scheduler \
            airflow-dag-processor \
            airflow-triggerer

      - name: Ejecutar tests
        run: |
          python -m pytest -q
